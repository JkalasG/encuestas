services:
  calitori:
    container_name: vilaseca-calitori
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MODO_ESPECIAL: ${VITE_MODO_ESPECIAL:-true}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MODO_ESPECIAL=${MODO_ESPECIAL:-true}
    volumes:
      - ./backend/data:/app/backend/data

