services:
  calitori:
    container_name: vilaseca-calitori
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_MODO_ESPECIAL: ${VITE_MODO_ESPECIAL:-true}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # Variables de Gmail (GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN, SENDER_ALIAS, SENDER_NAME)
    # se leen de backend/.env. Lo de "environment" tiene prioridad si se repite.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-vilaseca-calitori-secreto-produccion-2025}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - REGISTRO_ABIERTO=false
      - ADMIN_EMAIL=${ADMIN_EMAIL:-sgc@agencia-vilaseca.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-EPSIUQzurc.97}
      - MODO_ESPECIAL=${MODO_ESPECIAL:-true}
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/credentials:/app/backend/credentials:ro

    networks:
      - red-agencia

networks:
  red-agencia:
    external: true
    name: docker_red-agencia
